server {
    listen 80;
    server_name _;
    absolute_redirect off;
    root /usr/share/nginx/html;
    index index.html;

    location = /download/admin {
        return 302 /download/admin/;
    }

    location = /downloads/rustdesk-windows.exe {
        return 302 /downloads/rustdesk-support-windows.exe;
    }

    location / {
        try_files $uri $uri/ =404;
        add_header Cache-Control "no-store" always;
    }
}
